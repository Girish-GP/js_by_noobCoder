    <div class="parent">
  Parent

</div>
<hr>
<!-- Debounce -->
  <label for="search">Search</label>
  <input id="search-input" type="text" name="search" />
  <p id="search-text">Searching for ... </p>
<hr>
<script src="debounce.js"></script>
<script src="throttle.js"></script>
<script>
  document.querySelector('.parent').addEventListener('mouseover',  () => console.log('mouseover on parent'));
  document.querySelector('.parent').addEventListener('mouseenter', () => console.log('mouseenter on parent'));
  document.querySelector('.child').addEventListener('mouseover',  () => console.log('mouseover on child'));
  document.querySelector('.child').addEventListener('mouseenter', () => console.log('mouseenter on child'));
</script>

    <script src="domEvents.js"></script>
    <script src="https://unpkg.com/rxjs@7/dist/bundles/rxjs.umd.min.js"></script>

    <script>
      const { Observable} = rxjs;
    const { tap, map } = rxjs.operators;

      const customObservable = new Observable((subscriber) => {
        subscriber.next("Data 1");
        setTimeout(() => subscriber.next("Data 2"), 2000);
        setTimeout(() => subscriber.next("Data 3"), 4000);
      }).pipe(
        tap((res) => console.log("Before transformation", res)),
        map((res) => `After transformation ${res}_done`)
      );

      const subscription = customObservable.subscribe({
        next: (res) => console.log(res),
        // error: (error) => console.error(error),
        complete: () => {
          console.log("completed");
          subscription.unsubscribe();
        },
      });
    </script>
    <script src="pollyfills.js"></script>
  </body>
</html>

<!-- 

• An Observable represents a stream of values over time. It can emit
multiple values asynchronously, including errors or completion
notifications.
• It is lazy, meaning it doesn’t start producing values until subscribed to.
• Observables support operations like map, filter, and more to transform
stream


UMD stands for Universal Module Definition.
It’s a JavaScript module format that works in any environment:

Browser (script tag) → attaches a global object to window.

Node.js (CommonJS) → works with require().

AMD (Asynchronous Module Definition, e.g. RequireJS) → works with define().

👉 That’s why it’s called universal — one build works everywhere.
